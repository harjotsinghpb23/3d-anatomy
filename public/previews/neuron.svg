<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="somaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="60%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <linearGradient id="myelinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="neuronGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0077b6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Axon line -->
  <path d="M 65 65 L 155 155" stroke="#0077b6" stroke-width="4" stroke-linecap="round"/>
  <!-- Myelin Sheath Segments -->
  <rect x="76" y="72" width="18" height="10" rx="4" transform="rotate(45 85 77)" fill="url(#myelinGrad)"/>
  <rect x="98" y="94" width="18" height="10" rx="4" transform="rotate(45 107 99)" fill="url(#myelinGrad)"/>
  <rect x="120" y="116" width="18" height="10" rx="4" transform="rotate(45 129 121)" fill="url(#myelinGrad)"/>
  <!-- Axon Terminals -->
  <path d="M 152 152 Q 165 155 175 150 M 175 150 A 2 2 0 1 1 176 150" stroke="#0077b6" stroke-width="2.5" fill="none"/>
  <circle cx="176" cy="150" r="3.5" fill="#48cae4"/>
  <path d="M 152 152 Q 155 168 152 180" stroke="#0077b6" stroke-width="2.5" fill="none"/>
  <circle cx="152" cy="180" r="3.5" fill="#48cae4"/>
  <path d="M 152 152 Q 170 170 182 172" stroke="#0077b6" stroke-width="2.5" fill="none"/>
  <circle cx="182" cy="172" r="3.5" fill="#48cae4"/>
  <!-- Soma (Cell Body) with Dendrites -->
  <g filter="url(#neuronGlow)">
    <path d="M 60 55 C 65 42 75 35 68 20 C 58 32 50 38 42 30 C 40 42 32 45 20 42 C 30 52 35 60 25 72 C 38 70 45 78 48 90 C 56 78 62 72 65 65 Z" fill="url(#somaGrad)"/>
    <!-- Nucleus -->
    <circle cx="48" cy="52" r="9" fill="#ade8f4"/>
    <circle cx="48" cy="52" r="4.5" fill="#03045e"/>
  </g>
  <!-- Action Potential impulse sparkles -->
  <circle cx="96" cy="88" r="2.5" fill="#fff"/>
  <circle cx="118" cy="110" r="2.5" fill="#fff"/>
</svg>