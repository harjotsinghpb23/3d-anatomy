  <!-- Kidney Bean Organ -->
  <path d="M 85 30 C 130 30, 155 60, 150 100 C 145 135, 120 170, 80 170 C 40 170, 35 125, 45 95 C 55 65, 50 30, 85 30 Z" fill="url(#cortexGrad)" filter="url(#kidneyShadow)"/>
  <!-- Renal Medulla (Pyramids) -->
  <path d="M 75 55 L 90 70 L 68 78 Z" fill="url(#medullaGrad)"/>
  <path d="M 62 88 L 84 96 L 65 108 Z" fill="url(#medullaGrad)"/>
  <path d="M 65 118 L 88 120 L 72 138 Z" fill="url(#medullaGrad)"/>
  <path d="M 82 145 L 98 132 L 95 155 Z" fill="url(#medullaGrad)"/>
  <!-- Renal Pelvis / Calyces -->
  <path d="M 88 85 Q 98 100 88 125 Q 105 112 95 95 Z" fill="#ffe3d8" opacity="0.85"/>
</svg>