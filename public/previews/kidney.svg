<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c14953"/>
      <stop offset="50%" stop-color="#9e2a2b"/>
      <stop offset="100%" stop-color="#540b0e"/>
    </linearGradient>
    <linearGradient id="medullaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#9e2a2b"/>
    </linearGradient>
    <filter id="kidneyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Renal Artery & Vein -->
  <path d="M 100 92 L 155 85 L 153 98 L 105 102 Z" fill="#e63946"/>
  <path d="M 102 105 L 155 102 L 154 115 L 100 114 Z" fill="#457b9d"/>
  <!-- Ureter -->
