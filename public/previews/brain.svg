<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cerebrumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="50%" stop-color="#e76f51"/>
      <stop offset="100%" stop-color="#c84b31"/>
    </linearGradient>
    <linearGradient id="cerebellumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8c5b2"/>
      <stop offset="100%" stop-color="#b09e8c"/>
    </linearGradient>
    <filter id="brainShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Brainstem -->
  <path d="M 100 130 C 100 145, 102 165, 108 185 L 122 183 C 118 165, 116 145, 114 130 Z" fill="url(#stemGrad)"/>
  <!-- Cerebellum -->
  <path d="M 115 118 C 130 115, 160 125, 155 145 C 150 162, 125 160, 112 146 Z" fill="url(#cerebellumGrad)" filter="url(#brainShadow)"/>
  <path d="M 120 128 C 135 125, 148 132, 145 142" stroke="#b08968" stroke-width="1.5" fill="none"/>
  <path d="M 116 136 C 128 134, 142 140, 138 148" stroke="#b08968" stroke-width="1.5" fill="none"/>
  <!-- Cerebrum -->
  <path d="M 45 110 C 35 90, 42 55, 75 40 C 105 25, 148 30, 165 60 C 178 82, 172 110, 150 122 C 135 130, 110 128, 95 120 C 80 126, 55 125, 45 110 Z" fill="url(#cerebrumGrad)" filter="url(#brainShadow)"/>
  <!-- Gyri / Sulci Lines -->
  <path d="M 60 70 C 75 60, 85 80, 105 65 C 120 55, 135 70, 150 65" stroke="#ffe3d8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 50 90 C 70 85, 80 105, 100 95 C 120 85, 135 100, 160 90" stroke="#ffe3d8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 80 45 C 90 60, 95 85, 90 110" stroke="#9d3c27" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 125 40 C 130 65, 125 90, 132 115" stroke="#9d3c27" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 62 105 C 75 115, 90 108, 105 115" stroke="#ffe3d8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>