  <path d="M 80 88 Q 102 105 118 135" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 98 78 Q 120 95 138 122" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
