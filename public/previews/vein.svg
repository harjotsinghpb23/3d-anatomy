<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="arteryOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <linearGradient id="veinOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#457b9d"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="vesselShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Artery Cross Section & Tube (Left) -->
  <g filter="url(#vesselShadow)">
    <path d="M 40 50 L 40 140 C 40 155, 80 155, 80 140 L 80 50 Z" fill="url(#arteryOuter)"/>
    <ellipse cx="60" cy="50" rx="20" ry="10" fill="#f26b6e"/>
    <!-- Tunica Media thick wall -->
    <ellipse cx="60" cy="50" rx="14" ry="7" fill="#d90429"/>
    <!-- Lumen (oxygenated blood) -->
    <ellipse cx="60" cy="50" rx="9" ry="4.5" fill="#590d22"/>
  </g>
  <!-- Vein Cross Section & Valve (Right) -->
  <g filter="url(#vesselShadow)">
    <path d="M 120 50 L 120 140 C 120 155, 160 155, 160 140 L 160 50 Z" fill="url(#veinOuter)"/>
    <ellipse cx="140" cy="50" rx="20" ry="10" fill="#64a5f0"/>
    <!-- Thinner Tunica Media -->
    <ellipse cx="140" cy="50" rx="17" ry="8.5" fill="#2a6f97"/>
    <!-- Large Lumen -->
    <ellipse cx="140" cy="50" rx="13" ry="6.5" fill="#012a4a"/>
    <!-- Bicuspid Valve detail in cutaway -->
    <path d="M 128 100 Q 140 110 138 120" stroke="#a9d6e5" stroke-width="2.5" fill="none"/>
    <path d="M 152 100 Q 140 110 142 120" stroke="#a9d6e5" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Direction arrows -->
  <path d="M 60 115 L 60 85 M 56 92 L 60 85 L 64 92" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 140 85 L 140 115 M 136 108 L 140 115 L 144 108" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>