<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="epidermisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a598"/>
      <stop offset="100%" stop-color="#d68c7e"/>
    </linearGradient>
    <linearGradient id="dermisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3b0a0"/>
      <stop offset="100%" stop-color="#e29583"/>
    </linearGradient>
    <linearGradient id="subcutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9dc5c"/>
      <stop offset="100%" stop-color="#e5b824"/>
    </linearGradient>
    <filter id="skinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Block base -->
  <g filter="url(#skinShadow)">
    <!-- Subcutaneous / Hypodermis layer (yellow adipose) -->
    <rect x="30" y="135" width="140" height="35" rx="3" fill="url(#subcutGrad)"/>
    <circle cx="45" cy="148" r="6" fill="#fdf0a6" opacity="0.8"/>
    <circle cx="65" cy="155" r="7" fill="#fdf0a6" opacity="0.8"/>
    <circle cx="95" cy="148" r="8" fill="#fdf0a6" opacity="0.8"/>
    <circle cx="125" cy="153" r="6.5" fill="#fdf0a6" opacity="0.8"/>
    <circle cx="150" cy="147" r="7" fill="#fdf0a6" opacity="0.8"/>

    <!-- Dermis layer (pink/vascular) -->
    <rect x="30" y="75" width="140" height="60" fill="url(#dermisGrad)"/>
    <!-- Epidermis layer -->
    <rect x="30" y="58" width="140" height="17" fill="url(#epidermisGrad)"/>
    <!-- Stratum corneum surface -->
    <path d="M 30 58 Q 65 56 100 58 T 170 58 L 170 63 Q 135 61 100 63 T 30 63 Z" fill="#c47a6c"/>
  </g>

  <!-- Hair follicle & Shaft -->
  <path d="M 120 18 Q 112 50 95 130" stroke="#3d261a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Follicle Bulb -->
  <ellipse cx="94" cy="132" rx="7" ry="10" fill="#f4a261"/>
  <!-- Sebaceous Gland -->
  <circle cx="86" cy="98" r="7" fill="#e9c46a"/>
  <!-- Arrector Pili Muscle -->
  <path d="M 88 115 Q 75 105 68 85" stroke="#d62828" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Blood capillary loops -->
  <path d="M 50 145 Q 52 85 58 75 Q 64 85 66 145" stroke="#e63946" stroke-width="2.5" fill="none"/>
  <path d="M 140 145 Q 142 85 148 75 Q 154 85 156 145" stroke="#457b9d" stroke-width="2.5" fill="none"/>
  <!-- Sweat gland -->
  <path d="M 130 140 C 122 135 138 128 126 120 C 130 100 132 80 134 58" stroke="#8ecae6" stroke-width="2" fill="none"/>
</svg>