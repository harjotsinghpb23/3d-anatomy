<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Anatomy Lab</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  </head>
  <body>
    <script>
      // --- DATABASE ---
      const modelsDB = [
        { name: 'Skull', uid: 'd1d1aed420424c8db784391ad8261a2f', color: '#e5e5e5', x: -1.5, y: 0 },
        { name: 'Brain', uid: 'c26e0f2e75fe4087aa8c4ecee2cad1aa', color: '#f472b6', x: -0.5, y: 0 },
        { name: 'Heart', uid: ' 82d87cb89d6c48f0984a59c4f2a4cf9a', color: '#ef4444', x: 0.5, y: 0 },
        { name: 'Eye',   uid: '6529d87d70604e37b6a15ec70c173b96', color: '#60a5fa', x: 1.5, y: 0 },
        { name: 'Ear',   uid: '6ef85cb9061a4ef2abb9e87258c7d0fb', color: '#d6bcfa', x: -1.0, y: -1 },
        { name: 'Kidney',uid: '1fb2ea2ba18241b3be8affbcce5cd364', color: '#b45309', x: 0.0, y: -1 },
        { name: 'Skel',  uid: '6ef85cb9061a4ef2abb9e87258c7d0fb', color: '#d4d4d4', x: 1.0, y: -1 }
      ];

      // --- COMPONENT: CLICK LISTENER ---
      AFRAME.registerComponent('anatomy-loader', {
        init: function () {
          this.el.addEventListener('click', function (evt) {
            const uid = this.getAttribute('data-uid');
            const name = this.getAttribute('data-name');
            // Transition to the viewer scene (or load model dynamically)
            window.location.href = `viewer.html?uid=${uid}&name=${name}`;
          });
          
          // Hover Sound Effect (Optional)
          this.el.addEventListener('mouseenter', function () {
            this.setAttribute('scale', '1.1 1.1 1.1');
          });
          this.el.addEventListener('mouseleave', function () {
            this.setAttribute('scale', '1 1 1');
          });
        }
      });

      // --- COMPONENT: SPAWN MENU ---
      AFRAME.registerComponent('menu-spawner', {
        init: function() {
          const container = this.el;
          
          modelsDB.forEach(model => {
            // Create Card Background
            const card = document.createElement('a-entity');
            card.setAttribute('geometry', {primitive: 'plane', height: 0.8, width: 0.8});
            card.setAttribute('material', {color: '#1e232d', opacity: 0.8, transparent: true, shader: 'flat'});
            card.setAttribute('position', `${model.x} ${model.y + 1.6} -2.5`); // Curve them slightly in front
            card.setAttribute('class', 'clickable'); // IMPORTANT for raycaster
            card.setAttribute('data-uid', model.uid);
            card.setAttribute('data-name', model.name);
            card.setAttribute('anatomy-loader', '');
            
            // Add Border/Glow
            const border = document.createElement('a-entity');
            border.setAttribute('geometry', {primitive: 'plane', height: 0.82, width: 0.82});
            border.setAttribute('material', {color: model.color, shader: 'flat', side: 'back'});
            border.setAttribute('position', '0 0 -0.01');
            card.appendChild(border);

            // Add Text Label
            const text = document.createElement('a-text');
            text.setAttribute('value', model.name);
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 -0.3 0.01');
            text.setAttribute('scale', '0.8 0.8 0.8');
            card.appendChild(text);

            // Add Icon Representation (Simple sphere/cube placeholder for performance)
            const icon = document.createElement('a-entity');
            icon.setAttribute('geometry', {primitive: 'dodecahedron', radius: 0.15});
            icon.setAttribute('material', {color: model.color, wireframe: true});
            icon.setAttribute('position', '0 0.1 0.1');
            // Spin animation for the icon
            icon.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear');
            card.appendChild(icon);

            container.appendChild(card);
          });
        }
      });
    </script>

    <a-scene background="color: #050505">
      <a-assets>
        <img id="sky" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg"> </a-assets>

      <a-entity environment="preset: tron; grid: 1x1; skyType: atmosphere; lighting: point; lightPosition: 0 5 0"></a-entity>

      <a-light type="ambient" color="#222"></a-light>
      <a-light type="point" position="2 4 4" intensity="0.5" color="#64ffda"></a-light>

      <a-entity menu-spawner></a-entity>

      <a-text value="Select Anatomy Region" 
              position="0 3 -3" align="center" width="6" 
              color="#ffffff" font="kelsonsans"></a-text>

      <a-entity id="rig" position="0 0 0">
        
        <a-camera id="camera" look-controls>
          <a-cursor
            id="cursor"
            animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
            animation__fusing="property: fusing; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
            event-set__mouseenter="_event: mouseenter; color: #64ffda"
            event-set__mouseleave="_event: mouseleave; color: white"
            raycaster="objects: .clickable"
            material="color: white; shader: flat"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03">
          </a-cursor>
        </a-camera>

        <a-entity oculus-touch-controls="hand: left" 
                  laser-controls="hand: left" 
                  raycaster="objects: .clickable; far: 5"
                  line="color: #64ffda; opacity: 0.75"></a-entity>
        
        <a-entity oculus-touch-controls="hand: right" 
                  laser-controls="hand: right" 
                  raycaster="objects: .clickable; far: 5"
                  line="color: #64ffda; opacity: 0.75"></a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
