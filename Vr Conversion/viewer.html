<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Anatomy Viewer</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
  </head>
  <body>
    <script>
      // Parse URL params
      const urlParams = new URLSearchParams(window.location.search);
      const modelName = urlParams.get('name');
      const modelUid = urlParams.get('uid');

      AFRAME.registerComponent('init-viewer', {
        init: function() {
          // Set Title
          const title = document.querySelector('#model-title');
          title.setAttribute('value', modelName || "Unknown Model");
          
          // HERE you would normally load the specific GLB file based on UID
          // Example: this.el.setAttribute('gltf-model', `assets/${modelUid}.glb`);
          
          // For demo, we are generating a complex shape to represent anatomy
          console.log("Loading model ID:", modelUid);
        }
      });

      // Simple rotation component for VR hands grabbing (Simplified logic)
      AFRAME.registerComponent('rotatable', {
        tick: function() {
          this.el.object3D.rotation.y += 0.005; 
        }
      });
      
      function goBack() {
        window.location.href = 'index.html';
      }
    </script>

    <a-scene>
      <a-entity environment="preset: starry; grid: none; lighting: none"></a-entity>

      <a-entity light="type: ambient; color: #FFF; intensity: 0.3"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-0.5 1 1"></a-entity>
      <a-entity light="type: point; color: #64ffda; intensity: 0.5" position="2 2 2"></a-entity>

      <a-entity position="0 0.5 -1.5" 
                geometry="primitive: plane; width: 0.8; height: 0.3" 
                material="color: #333; opacity: 0.8"
                class="clickable"
                onclick="goBack()">
        <a-text value="< Back to Lab" align="center" color="#64ffda"></a-text>
      </a-entity>

      <a-text id="model-title" value="Loading..." position="0 2.5 -3" align="center" scale="2 2 2"></a-text>

      <a-entity id="anatomy-model"
                position="0 1.6 -3" 
                init-viewer
                rotatable>
          
          <a-entity geometry="primitive: torusKnot; radius: 0.5; radiusTubular: 0.08; p: 2; q: 3" 
                    material="color: #f472b6; metalness: 0.6; roughness: 0.2"
                    animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutElastic">
          </a-entity>

          <a-cylinder position="0 -1 0" radius="0.8" height="0.1" material="color: #64ffda; opacity: 0.2; wireframe: true"></a-cylinder>
          <a-cone position="0 -1 0" radius-bottom="0" radius-top="0.8" height="1" material="color: #64ffda; opacity: 0.1; transparent: true"></a-cone>
      </a-entity>

      <a-entity id="rig">
        <a-camera position="0 1.6 0">
           <a-cursor color="#64ffda" raycaster="objects: .clickable"></a-cursor>
        </a-camera>
        <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
