<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Anatomy Viewer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* --- CORE STYLES --- */
        body { 
            margin: 0; overflow: hidden; background-color: #000000;
            font-family: 'Inter', sans-serif; user-select: none;
        }

        /* --- 3D CONTAINER --- */
        #model-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; overflow: hidden;
        }

        /*
         * No CSS transform on iframe — it breaks pointer-event mapping.
         * Instead we rely on Sketchfab embed parameters to hide the
         * top bar, bottom bar, watermark, and all controls.
         * The iframe fills the viewport exactly; the model is fully interactive.
         */
        iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* --- LOADER --- */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #64ffda; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status { font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="status">INITIALIZING MODEL...</div>
    </div>

    <div id="model-container">
        <iframe id="sketchfab-frame" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const modelName = urlParams.get('name') || 'Anatomy Model';

        const iframe = document.getElementById('sketchfab-frame');
        const loader = document.getElementById('loader');

        if (uid) {
            /* 
             * Embed parameters to remove ALL Sketchfab chrome:
             * - autostart=1          : start immediately
             * - ui_theme=dark        : dark theme
             * - ui_infos=0           : hide model info panel
             * - ui_controls=0        : hide all viewer controls (rotate/zoom/pan hints)
             * - ui_watermark=0       : hide Sketchfab watermark/logo
             * - ui_watermark_link=0  : hide watermark link
             * - ui_ar=0              : hide AR button
             * - ui_vr=0              : hide VR button
             * - ui_annotations=0     : hide annotations
             * - ui_stop=0            : hide stop/play
             * - ui_fullscreen=0      : hide fullscreen button
             * - ui_inspector=0       : hide inspector
             * - ui_help=0            : hide help
             * - transparent=0        : opaque background (our page is black)
             * - dnt=1                : do not track
             * - preload=1            : preload for faster start
             */
            iframe.src = `https://sketchfab.com/models/${uid}/embed?autostart=1&ui_theme=dark&ui_infos=0&ui_controls=0&ui_watermark=0&ui_watermark_link=0&ui_ar=0&ui_vr=0&ui_annotations=0&ui_stop=0&ui_fullscreen=0&ui_inspector=0&ui_help=0&transparent=0&dnt=1&preload=1`;
        } else {
            document.getElementById('status').innerText = 'ERROR: NO MODEL ID';
            document.querySelector('.spinner').style.display = 'none';
        }

        iframe.onload = function() {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 1000);
        };
    </script>
</body>
</html>
